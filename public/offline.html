<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 32px;
        background: #f5f5f5;
        color: #1f1f1f;
      }
      .card {
        max-width: 520px;
        margin: 64px auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 8px 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection</h1>
      <p>
        The app is available offline. Make sure the required media has already been
        cached.
      </p>
      <p>Once you are back online, return to the home page.</p>
    </div>
  </body>
</html>
